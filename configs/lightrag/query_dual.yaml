# Query-time LightRAG: one Qwen3.5-9B per 5090, embedding on CPU.
# Do not use this file to rebuild the index; keep configs/lightrag/build.yaml for that.

dataset: medical

log_dir: logs/lightrag

llm:
  model_path: models/llm/Qwen3.5-9B
  served_model_name: Qwen3.5-9B
  api_key: EMPTY
  max_tokens: 10240
  enable_thinking: true
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 1.5
  repetition_penalty: 1.0

vllm:
  host: 127.0.0.1
  port: 8000
  uds: /tmp/safe-rag-vllm.sock
  devices: [0, 1]
  replicate: true
  gpu_memory_utilization: 0.92
  max_model_len: 30720
  max_num_seqs: 32
  dtype: auto
  extra_args:
    - --trust-remote-code
    - --language-model-only
    - --reasoning-parser
    - qwen3
  startup_timeout_s: 1300

embedding:
  backend: cpu
  device: cpu
  replicas: 4
  model_path: models/embedding/Qwen3-Embedding-4B
  model: Qwen3-Embedding-4B
  dim: 2560
  api_key: EMPTY
  max_model_len: 8192

chunking:
  chunk_token_size: 1200
  chunk_overlap_token_size: 100
  chars_per_token: 4

insert:
  max_async: 16
  batch_size: 32
